<!-- Жив Помощник: плаващ чат "кое ми трябва". Един код за целия сайт alive-garden.com.
     Скрива се сам на чекаути, ъпсели, благодарствени и правни страници.
     Маха стария бутон (#zhiv-btn), ако е още на страницата. -->
<style>
  #zpm-btn, #zpm-panel, #zpm-tip { font-family: Arial, Helvetica, sans-serif; box-sizing: border-box; }
  #zpm-panel *, #zpm-btn * { box-sizing: border-box; }
  #zpm-btn {
    position: fixed; right: 20px; bottom: 20px; z-index: 2147483000;
    display: flex; align-items: center; gap: 8px;
    height: 52px; padding: 0 18px 0 14px; border: 0; border-radius: 999px;
    background: #173f2b; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .2s;
  }
  #zpm-btn:hover { transform: translateY(-2px); }
  #zpm-btn svg { width: 22px; height: 22px; fill: #e7b54b; flex-shrink: 0; }
  #zpm-tip {
    position: fixed; right: 20px; bottom: 82px; z-index: 2147483000;
    max-width: 230px; padding: 10px 14px; border-radius: 12px;
    background: #fffdf8; color: #16261c; font-size: 14px; line-height: 1.4;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); cursor: pointer;
  }
  #zpm-panel {
    position: fixed; right: 20px; bottom: 84px; z-index: 2147483001;
    width: 370px; height: min(560px, calc(100vh - 110px));
    display: none; flex-direction: column; overflow: hidden;
    border-radius: 16px; background: #f7f4ec; box-shadow: 0 12px 40px rgba(0,0,0,.28);
  }
  #zpm-panel.zpm-open { display: flex; }
  #zpm-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; background: #173f2b; color: #fff; flex-shrink: 0;
  }
  #zpm-head strong { display: block; font-size: 15px; }
  #zpm-head span { display: block; font-size: 12px; color: #cfe0d3; }
  #zpm-x { border: 0; background: none; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; opacity: .85; padding: 4px; }
  #zpm-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .zpm-msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .zpm-bot { align-self: flex-start; background: #fffdf8; color: #16261c; border: 1px solid #e2ddcf; border-bottom-left-radius: 4px; }
  .zpm-me { align-self: flex-end; background: #173f2b; color: #fff; border-bottom-right-radius: 4px; }
  .zpm-bot a { color: #173f2b; font-weight: 700; text-decoration: underline; }
  .zpm-wait { color: #5d675f; font-style: italic; }
  #zpm-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
  .zpm-chip {
    border: 1px solid #c9cfbf; background: #fff; color: #173f2b; border-radius: 999px;
    padding: 7px 11px; font-size: 13px; cursor: pointer;
  }
  .zpm-chip:hover { background: #eef1e9; }
  #zpm-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e2ddcf; background: #fffdf8; flex-shrink: 0; }
  #zpm-in {
    flex: 1; min-width: 0; resize: none; height: 42px; max-height: 96px;
    padding: 10px 12px; border: 1px solid #c9cfbf; border-radius: 10px;
    font: 15px/1.4 Arial, Helvetica, sans-serif; color: #16261c; background: #fff;
  }
  #zpm-in:focus { outline: 2px solid #e7b54b; border-color: transparent; }
  #zpm-send { border: 0; border-radius: 10px; padding: 0 16px; background: #e7b54b; color: #1d2a20; font-weight: 800; font-size: 14px; cursor: pointer; }
  #zpm-send:disabled { opacity: .5; cursor: default; }
  #zpm-note { padding: 0 12px 8px; background: #fffdf8; color: #8a8f84; font-size: 11px; text-align: center; flex-shrink: 0; }
  @media (max-width: 480px) {
    #zpm-panel { right: 8px; left: 8px; width: auto; bottom: 8px; height: calc(100vh - 16px); height: calc(100dvh - 16px); }
    #zpm-btn { right: 14px; bottom: 14px; height: 48px; font-size: 14px; }
    #zpm-tip { right: 14px; bottom: 72px; }
    #zpm-in { font-size: 16px; } /* без автоматично увеличаване в iPhone */
  }
</style>

<script>
(function () {
  var API = 'https://zhiv-pomoshnik.onrender.com';
  var HIDE = /chekout|checkout|thank|blagodar|-up(\/|$)|upsell|obschi-usloviya|politika|usloviya-za/i;
  if (HIDE.test(location.pathname) || document.getElementById('zpm-btn')) return;

  var GREETING = 'Здравей! Кажи ми какво виждаш в градината или какво искаш да постигнеш и ще ти кажа коя книга или карта ти трябва.';
  var CHIPS = ['Имам вредители по растенията', 'Торя, а растенията остават слаби', 'Какво да правя с излишната реколта?', 'Как се поръчва и плаща?'];
  var KEY = 'zpm-history';

  function store(get, val) {
    try { if (get) return JSON.parse(sessionStorage.getItem(KEY) || '[]'); sessionStorage.setItem(KEY, JSON.stringify(val)); } catch (e) { return get ? [] : undefined; }
  }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function linkify(s) {
    return esc(s).replace(/https:\/\/(www\.)?alive-garden\.com[^\s<,)]*/g, function (u) {
      var clean = u.replace(/[.!?;:]+$/, ''), rest = u.slice(clean.length);
      return '<a href="' + clean + '">' + clean.replace('https://', '') + '</a>' + rest;
    });
  }

  function init() {
    ['zhiv-btn', 'zhiv-panel', 'zhiv-tip'].forEach(function (id) { var o = document.getElementById(id); if (o) o.remove(); });

    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<div id="zpm-tip">Не знаеш откъде да започнеш? Питай ме.</div>' +
      '<button id="zpm-btn" type="button" aria-label="Отвори Жив Помощник"><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM7 9h10v2H7V9zm6 5H7v-2h6v2zm4-6H7V6h10v2z"/></svg>Кое ми трябва?</button>' +
      '<div id="zpm-panel" role="dialog" aria-label="Жив Помощник">' +
        '<div id="zpm-head"><div><strong>Жив Помощник</strong><span>Ще ти кажа коя книга или карта ти трябва</span></div><button id="zpm-x" type="button" aria-label="Затвори">✕</button></div>' +
        '<div id="zpm-log" aria-live="polite"></div>' +
        '<div id="zpm-chips"></div>' +
        '<form id="zpm-form"><textarea id="zpm-in" rows="1" maxlength="600" placeholder="Напиши въпроса си..."></textarea><button id="zpm-send" type="submit">Прати</button></form>' +
        '<div id="zpm-note">AI помощник. Може да сгреши, провери в описанието на продукта.</div>' +
      '</div>';
    while (wrap.firstChild) document.body.appendChild(wrap.firstChild);

    var btn = document.getElementById('zpm-btn'), tip = document.getElementById('zpm-tip'), panel = document.getElementById('zpm-panel');
    var log = document.getElementById('zpm-log'), chips = document.getElementById('zpm-chips');
    var form = document.getElementById('zpm-form'), input = document.getElementById('zpm-in'), send = document.getElementById('zpm-send');
    var history = store(true), busy = false, woke = false;

    function add(role, text, cls) {
      var d = document.createElement('div');
      d.className = 'zpm-msg ' + (role === 'user' ? 'zpm-me' : 'zpm-bot') + (cls ? ' ' + cls : '');
      if (role === 'user') d.textContent = text; else d.innerHTML = linkify(text);
      log.appendChild(d); log.scrollTop = log.scrollHeight;
      return d;
    }
    function render() {
      log.innerHTML = '';
      add('assistant', GREETING);
      history.forEach(function (m) { add(m.role, m.content); });
      chips.style.display = history.length ? 'none' : 'flex';
    }
    CHIPS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'zpm-chip'; b.textContent = c;
      b.onclick = function () { ask(c); };
      chips.appendChild(b);
    });

    function wake() {
      if (woke) return; woke = true;
      try { fetch(API + '/health').catch(function () {}); } catch (e) {}
    }
    function toggle(open) {
      var show = open === undefined ? !panel.classList.contains('zpm-open') : open;
      panel.classList.toggle('zpm-open', show);
      tip.style.display = 'none';
      btn.style.display = show && window.innerWidth <= 480 ? 'none' : '';
      if (show) { wake(); render(); setTimeout(function () { input.focus(); }, 50); }
    }

    function ask(text) {
      text = (text || '').trim();
      if (!text || busy) return;
      busy = true; send.disabled = true; chips.style.display = 'none';
      history.push({ role: 'user', content: text.slice(0, 600) });
      add('user', text);
      input.value = '';
      var wait = add('assistant', 'Мисля...', 'zpm-wait');
      var slow = setTimeout(function () { wait.textContent = 'Събуждам се, още няколко секунди...'; }, 6000);
      fetch(API + '/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.slice(-12) })
      }).then(function (r) {
        return r.json().then(function (d) { return { ok: r.ok, d: d }; });
      }).then(function (res) {
        var a = (res.d && res.d.answer) || 'Не успях да отговоря. Опитай пак.';
        wait.remove(); add('assistant', a);
        // Грешка или лимит: въпросът не остава в историята, за да не се праща пак
        if (res.ok) history.push({ role: 'assistant', content: a }); else history.pop();
      }).catch(function () {
        wait.remove(); history.pop();
        add('assistant', 'Нямам връзка в момента. Опитай пак след малко.');
      }).then(function () {
        clearTimeout(slow); busy = false; send.disabled = false;
        store(false, history.slice(-12));
      });
    }

    btn.onclick = function () { toggle(); };
    tip.onclick = function () { toggle(true); };
    document.getElementById('zpm-x').onclick = function () { toggle(false); };
    form.onsubmit = function (e) { e.preventDefault(); ask(input.value); };
    input.onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && panel.classList.contains('zpm-open')) toggle(false); });
    setTimeout(function () { tip.style.display = 'none'; }, 9000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
